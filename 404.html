<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seite nicht gefunden - 404</title>
    <style>
        :root{
            --background: #f9f9f9;
            --background-box: #bbbbbb;
            --shadow-box: 0px 4px 16px rgba(0,0,0,0.5);
            --text-title: #24292e;
            --text-button: #ffffff;
            --text-other: #666666;
            --color-button: #000000;
            --color-button-hover: #00a000;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 20px;
            background: var(--background-box);
            border-radius: 15px;
            box-shadow: var(--shadow-box);
        }
        h1 {
            font-size: 6rem;
            margin: 0;
            color: var(--text-title);
        }
        p {
            font-size: 1.25rem;
            color: var(--text-other);
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background-color: var(--color-button);
            color: var(--text-button);
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: var(--color-button-hover);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>404</h1>
        <p>Hoppla! Die gesuchte Seite existiert nicht oder wurde verschoben.</p>
        <a href="./" class="btn">Zurück zur Startseite</a>
    </div>

</body>
</html>
